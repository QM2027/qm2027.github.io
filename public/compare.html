<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Preview comparison</title>
<!--
  Versions of the site side by side, for discussion: tick any mix of edition (visitor guide,
  conference app) and look (current design, ?look=plain, ?look=brand), two or more at once.
  Each frame is named "qm2027:edition=…&notice=…&look=…"; the site's inline script reads that name
  (see src/lib/edition-script.ts), so the frames keep their settings while you click around in
  them and never touch this browser's own setting.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #666666; --border: #e2e2e2; --surface: #f5f5f5; --accent: #bd400c;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0e0e; --fg: #ececec; --muted: #9a9a9a; --border: #2b2b2b; --surface: #191919; --accent: #ff7a3d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: flex-start; }
  h1 { flex-basis: 100%; margin: 0; font: 500 12px/1 ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; margin-bottom: 4px; font: 12px ui-monospace, monospace; color: var(--muted); }
  input { accent-color: var(--accent); margin: 0; }
  label { display: flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }
  .options { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  table { border-collapse: collapse; font-size: 14px; }
  th { font-weight: 400; text-align: left; padding: 2px 14px 2px 0; }
  thead th { font: 12px ui-monospace, monospace; color: var(--muted); }
  td { padding: 2px 14px 2px 0; }
  td label { justify-content: flex-start; }
  #hint { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--muted); }
  main { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 24px; padding: 20px 16px 40px; }
  main.phone { justify-content: center; grid-template-columns: repeat(var(--cols, 2), minmax(0, 390px)); }
  main:empty::before { content: "Tick at least one version above."; color: var(--muted); }
  figure { margin: 0; min-width: 0; }
  figcaption { font: 500 12px ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
  figcaption a { color: var(--muted); text-transform: none; letter-spacing: 0; white-space: nowrap; }
  .viewport { border: 1px solid var(--border); overflow: hidden; position: relative; }
  iframe { border: 0; display: block; transform-origin: 0 0; background: var(--bg); }
  @media (max-width: 860px) {
    main, main.phone { grid-template-columns: minmax(0, 1fr); justify-items: center; }
    main.phone figure { width: min(390px, 100%); }
  }
</style>
</head>
<body>
<header>
  <h1>QM2027 previews</h1>
  <fieldset>
    <legend>Compare (tick two or more)</legend>
    <table id="variants"></table>
  </fieldset>
  <fieldset>
    <legend>When</legend>
    <div class="options" id="phases"></div>
  </fieldset>
  <fieldset>
    <legend>Size</legend>
    <div class="options" id="sizes"></div>
  </fieldset>
  <fieldset>
    <legend>Bar</legend>
    <label><input type="checkbox" id="notice"> Hide “Not fully developed” bar</label>
  </fieldset>
  <p id="hint"></p>
</header>
<main id="frames"></main>
<script>
  // Times are pinned with ?now=. The conference week uses the QM2025 program that program-data
  // publishes until the QM2027 timetable is out, so those presets also force ?phase=week.
  const PHASES = [
    { id: "live", label: "Live", q: "", hint: "Today’s real date." },
    { id: "prep", label: "Before (Dec)", q: "now=2026-12-01T10:00:00%2B09:00", hint: "1 Dec 2026: registration open, next deadlines ahead." },
    { id: "departure", label: "Before (Mar)", q: "now=2027-03-05T10:00:00%2B09:00", hint: "5 Mar 2027: registration closed, trip preparation." },
    { id: "arrival", label: "Arrival", q: "now=2025-04-05T17:00:00%2B02:00&phase=week", hint: "The day before the opening, shown with the QM2025 program." },
    { id: "week", label: "During", q: "now=2025-04-08T11:20:00%2B02:00&phase=week", hint: "Mid-morning on day 3, shown with the QM2025 program." },
    { id: "after", label: "After", q: "now=2027-04-01T10:00:00%2B09:00", hint: "1 Apr 2027: the conference is over." },
  ];
  const SIZES = [
    { id: "phone", label: "Phone", w: 390, h: 844 },
    { id: "desktop", label: "Desktop", w: 1280, h: 800 },
  ];
  const EDITIONS = [
    { id: "guide", label: "Visitor guide" },
    { id: "app", label: "Conference app" },
  ];
  const LOOKS = [
    { id: "default", label: "Current" },
    { id: "plain", label: "Plain" },
    { id: "brand", label: "Brand" },
  ];
  const key = (ed, look) => ed + "/" + look;

  const state = { picks: [key("guide", "default"), key("app", "default")], phase: "week", size: "phone", notice: true };
  try { Object.assign(state, JSON.parse(sessionStorage.getItem("compare2") || "{}")); } catch (_) {}

  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // Edition × look grid of checkboxes.
  $("variants").innerHTML =
    "<thead><tr><th></th>" + LOOKS.map((l) => `<th scope="col">${esc(l.label)}</th>`).join("") + "</tr></thead><tbody>" +
    EDITIONS.map((e) => `<tr><th scope="row">${esc(e.label)}</th>` +
      LOOKS.map((l) => `<td><label><input type="checkbox" value="${key(e.id, l.id)}" aria-label="${esc(e.label + ", " + l.label.toLowerCase() + " look")}"></label></td>`).join("") +
      "</tr>").join("") + "</tbody>";
  for (const cb of document.querySelectorAll("#variants input")) {
    cb.onchange = () => {
      state.picks = [...document.querySelectorAll("#variants input:checked")].map((c) => c.value);
      render();
    };
  }

  function radios(container, items, name) {
    for (const it of items) {
      const l = document.createElement("label");
      l.innerHTML = `<input type="radio" name="${name}" value="${it.id}"> ${esc(it.label)}`;
      l.firstElementChild.onchange = () => { state[name] = it.id; render(); };
      container.append(l);
    }
  }
  radios($("phases"), PHASES, "phase");
  radios($("sizes"), SIZES, "size");
  $("notice").onchange = (e) => { state.notice = !e.target.checked; render(); };

  function fit() {
    const size = SIZES.find((s) => s.id === state.size) || SIZES[0];
    for (const vp of document.querySelectorAll(".viewport")) {
      const scale = Math.min(1, vp.parentElement.clientWidth / size.w);
      vp.style.width = size.w * scale + "px";
      vp.style.height = size.h * scale + "px";
      vp.firstElementChild.style.transform = `scale(${scale})`;
    }
  }

  function render() {
    try { sessionStorage.setItem("compare2", JSON.stringify(state)); } catch (_) {}
    for (const cb of document.querySelectorAll("#variants input")) cb.checked = state.picks.includes(cb.value);
    for (const r of document.querySelectorAll('input[name="phase"]')) r.checked = r.value === state.phase;
    for (const r of document.querySelectorAll('input[name="size"]')) r.checked = r.value === state.size;
    $("notice").checked = !state.notice;
    const phase = PHASES.find((p) => p.id === state.phase) || PHASES[0];
    const size = SIZES.find((s) => s.id === state.size) || SIZES[0];
    $("hint").textContent = phase.hint + " Links inside each frame keep its edition and look.";

    // Frames in grid order: guide before app, current before plain before brand.
    const picked = [];
    for (const e of EDITIONS) for (const l of LOOKS) if (state.picks.includes(key(e.id, l.id))) picked.push({ e, l });

    const frames = $("frames");
    frames.className = size.id;
    // Desktop frames are scaled down, so at most three per row; phones fit up to four.
    frames.style.setProperty("--cols", String(Math.max(1, Math.min(picked.length, size.id === "phone" ? 4 : 3))));
    frames.replaceChildren();
    for (const { e, l } of picked) {
      const label = e.label + (l.id === "default" ? ", current design" : ", " + l.label.toLowerCase() + " look");
      const prefs = new URLSearchParams();
      if (e.id === "app") prefs.set("edition", "app");
      if (!state.notice) prefs.set("notice", "off");
      if (l.id !== "default") prefs.set("look", l.id);
      const src = "./" + (phase.q ? "?" + phase.q : "");
      // The same view in a tab of its own (this sets that tab's remembered edition and look).
      const own = "./?" + [phase.q, "edition=" + e.id, state.notice ? "notice=on" : "notice=off", "look=" + l.id].filter(Boolean).join("&");

      const fig = document.createElement("figure");
      fig.innerHTML = `<figcaption><span>${esc(label)}</span><a href="${own}" target="_blank" rel="noopener">Open in a tab ↗</a></figcaption><div class="viewport"><iframe title="${esc(label)}"></iframe></div>`;
      const iframe = fig.querySelector("iframe");
      iframe.name = "qm2027:" + prefs.toString();
      iframe.width = size.w;
      iframe.height = size.h;
      iframe.src = src;
      frames.append(fig);
    }
    fit();
  }

  addEventListener("resize", fit);
  render();
</script>
</body>
</html>
